services:
  # 1. FastAPI Autonomous Recovery Backend Engine
  - type: web
    name: reviveai-api
    runtime: python
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        value: sqlite:///./reviveai.db
      - key: APPROVAL_THRESHOLD_INR
        value: "50000.0"
      - key: MAX_RETRIES
        value: "2"
      - key: GEMINI_API_KEY
        sync: false

  # 2. Modern React & TypeScript Frontend Console
  - type: web
    name: reviveai-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: reviveai-api
          type: web
          property: host
