version: '3.8'

services:
  backend:
    container_name: reviveai-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./reviveai.db
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - APPROVAL_THRESHOLD_INR=50000.0
      - MAX_RETRIES=2
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped

  frontend:
    container_name: reviveai-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
